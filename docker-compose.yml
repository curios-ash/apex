services:
  db:
    image: postgres:17-alpine
    container_name: apex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apex
    ports:
      - "5432:5432"
    volumes:
      - apex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apex"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  apex-pgdata:
